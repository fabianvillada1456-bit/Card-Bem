<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
<title>Card</title>
</head>
<body>

  <div class="card">

    <!-- 1. IMAGEN: cambia el src y el alt -->
    <div class="card__image-wrap">
      <img src="assets/img/descarga.jpg" alt=""class="card_image">

    </div>

    <div class="card__body">

      <!-- 2. TÍTULO -->
      <h1 class="card__title">Título aquí</h1>

      <!-- 3. DESCRIPCIÓN -->
      <p class="card__description">
        Escribe aquí la descripción breve de lo que estás mostrando.
      </p>

      <!-- 4. BOTONES -->
      <div class="card__actions">
        <button class="btn btn--primary">Botón 1</button>
        <button class="btn btn--secondary">Botón 2</button>
      </div>

    </div>
  </div>

</body>
</html>
